name: CI & Release

on:
  push:
    branches: ['**']
    tags:
      - 'v*'
  pull_request:
    branches: ['**']

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target aarch64-apple-darwin

      - name: Package binary
        run: |
          mkdir -p rubiks-cube-macos-arm64
          cp target/aarch64-apple-darwin/release/rubiks-cube rubiks-cube-macos-arm64/
          cp README.md rubiks-cube-macos-arm64/ 2>/dev/null || true
          tar czf rubiks-cube-macos-arm64.tar.gz rubiks-cube-macos-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: rubiks-cube-macos-arm64.tar.gz

  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path rubiks-cube-windows-x64 -Force
          Copy-Item target/x86_64-pc-windows-msvc/release/rubiks-cube.exe rubiks-cube-windows-x64/
          Copy-Item README.md rubiks-cube-windows-x64/ -ErrorAction SilentlyContinue
          Compress-Archive -Path rubiks-cube-windows-x64/* -DestinationPath rubiks-cube-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: rubiks-cube-windows-x64.zip

  build-windows-arm64:
    name: Build Windows ARM64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install LLVM (for ARM64 Windows linking)
        run: choco install llvm

      - name: Build release binary
        run: cargo build --release --target aarch64-pc-windows-msvc

      - name: Package binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path rubiks-cube-windows-arm64 -Force
          Copy-Item target/aarch64-pc-windows-msvc/release/rubiks-cube.exe rubiks-cube-windows-arm64/
          Copy-Item README.md rubiks-cube-windows-arm64/ -ErrorAction SilentlyContinue
          Compress-Archive -Path rubiks-cube-windows-arm64/* -DestinationPath rubiks-cube-windows-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: rubiks-cube-windows-arm64.zip

  # ── 只在推送 tag 时创建 GitHub Release ──
  release:
    name: Create GitHub Release
    needs: [build-macos-arm64, build-windows-x64, build-windows-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/macos-arm64/rubiks-cube-macos-arm64.tar.gz
            artifacts/windows-x64/rubiks-cube-windows-x64.zip
            artifacts/windows-arm64/rubiks-cube-windows-arm64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
